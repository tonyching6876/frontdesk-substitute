<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>前臺代班查詢</title><style>
:root{font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif;color:#173d3e;background:#f1f6f5}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1120px;margin:auto}h1{font-size:26px;margin:0 0 10px}.intro{color:#587173;font-size:14px;line-height:1.7;margin:0 0 18px}.notice{padding:18px 20px;border:1px solid #bad4c9;background:#e6f2ec;border-radius:14px;display:flex;gap:18px;align-items:center;justify-content:space-between}.notice strong{display:block;line-height:1.6}.stamp{font-size:13px;color:#4a6665;margin-top:5px}button{background:#205c50;color:white;border:0;border-radius:9px;padding:12px 18px;font:inherit;white-space:nowrap;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#status{font-size:14px;padding:12px 2px;line-height:1.6}.error{color:#a12527}.warn{color:#8b570d}fieldset{border:0;margin:0;padding:20px;background:white;border-radius:14px;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:12px}label{font-weight:600;display:block}select,input{width:100%;margin-top:7px;padding:10px;border:1px solid #c2cecd;border-radius:8px;background:white;color:#173d3e;font:inherit}.cycle{color:#607474;font-size:14px;line-height:1.7;margin-top:16px}.counts{font-weight:700;margin:14px 0;color:#26604f}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.card{background:white;border:1px solid #dce7e4;border-radius:12px;padding:14px;line-height:1.5}.name{font-weight:700}.meta,.reason{font-size:13px;color:#607474;margin-top:5px}.reason{color:#3d6e5a}h2{font-size:19px;margin:22px 0 12px}.empty{font-size:14px;color:#657675;grid-column:1/-1;padding:18px 0}details{margin-top:22px}summary{cursor:pointer;font-weight:600}.pending .reason{color:#8b570d}footer{font-size:12px;color:#617774;line-height:1.7;margin-top:24px}button:focus-visible,summary:focus-visible{outline:3px solid #d49b46;outline-offset:3px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}fieldset{grid-template-columns:1fr 1fr}}@media(max-width:600px){body{padding:12px}h1{font-size:22px;line-height:1.4}select,input{font-size:16px;min-height:46px}fieldset{grid-template-columns:1fr}.notice{display:block}.notice button{width:100%;margin-top:12px}fieldset{padding:14px}.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1 id="page-title">前臺代班查詢</h1>
<p class="intro">依共同班表尋找可詢問人選。名單不代表本人方便代班，請再聯絡確認。</p>
<div class="notice"><div><strong>查詢前請先按「更新班表」；顯示更新成功後，再查詢可代班人選。</strong><div id="stamp" class="stamp">尚未成功讀取雲端班表</div></div><button id="refresh" type="button">更新班表</button></div>
<div id="status" role="status" aria-live="polite">準備讀取雲端「十一月班表」…</div>
<fieldset id="filters" disabled><label>日期<select id="date"></select></label><label>場地<select id="venue"><option value="C">音樂廳 C</option><option value="N">戲劇院 N</option><option value="E">實驗劇場 E</option><option value="R">演奏廳 R</option></select></label><label>時段<select id="slot"><option value="1">早場</option><option value="2">午場</option><option value="3" selected>晚場</option></select></label><label>姓名<input id="name" type="search" placeholder="篩選姓名"></label></fieldset>
<div id="results" hidden><div id="cycle" class="cycle"></div><div id="counts" class="counts" aria-live="polite"></div><h2>可詢問名單</h2><div id="eligible" class="grid"></div><details id="pending-section"><summary id="pending-title">待確認名單</summary><p class="intro">資料不足的人員不列入可詢問名單，請由督導確認。</p><div id="pending" class="grid pending"></div></details><details><summary id="blocked-title">排除原因</summary><div id="blocked" class="grid"></div></details></div>
<footer>週期：週三至下週二，每週期最多值勤 5 天。同一天接其他空缺時段不增加值勤日；連班只計一天。<br>試用期僅可接音樂廳與演奏廳；正職與實習生不列入。本頁顯示的時間是最後成功讀取時間，更新後的班表修改仍需再次按「更新班表」。</footer>
</main><script src="site-config.js"></script><script src="core.js"></script><script src="roster-client.js"></script><script>

let roster=null;
const $=id=>document.getElementById(id);
function md(k){return Number(k.slice(5,7))+'/'+Number(k.slice(8,10));}
function renderCards(id,list){const box=$(id);box.replaceChildren();if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent='沒有符合的人選';box.append(e);return;}for(const item of list){const p=item.p,c=document.createElement('article');c.className='card';for(const [cls,text] of [['name',p.name],['meta','身分：'+p.role+(p.trainer?' · 訓練員':'')+(p.trial?' · 試用期':'')],['meta','當日班別：'+(p.days[$('date').value]||'空白')],['reason',item.result.reason]]){const e=document.createElement('div');e.className=cls;e.textContent=text;c.append(e);}box.append(c);}}
function render(){if(!roster)return;const date=$('date').value,venue=$('venue').value,slot=Number($('slot').value),name=$('name').value.trim(),lists={eligible:[],pending:[],blocked:[]};let restricted=0;for(const p of roster.people){if(name&&!p.name.includes(name))continue;if(p.trial&&!['C','R'].includes(venue)){restricted++;continue;}const result=checkCandidate(p,date,slot,roster.maxDays);lists[result.status].push({p,result});}const cycle=cycleFor(date);$('cycle').textContent='本次週期：'+md(cycle[0])+'～'+md(cycle[6])+'（週三至週二） · 以值勤日期數計算，同日連班只算一天';$('counts').textContent='可詢問 '+lists.eligible.length+' 人 · 待確認 '+lists.pending.length+' 人 · 已有班／週期額滿 '+lists.blocked.length+' 人'+(restricted?' · 場地資格不符 '+restricted+' 人':'');$('pending-title').textContent='待確認名單（'+lists.pending.length+' 人）';$('blocked-title').textContent='排除原因（'+lists.blocked.length+' 人）';for(const id of Object.keys(lists))renderCards(id,lists[id]);$('pending-section').hidden=!lists.pending.length;$('results').hidden=false;}
function refresh(){roster=null;$('results').hidden=true;$('filters').disabled=true;$('refresh').disabled=true;$('refresh').textContent='更新中…';$('status').className='';$('status').textContent='正在讀取雲端班表，請稍候…';const fail=()=>{$('status').className='error';$('status').textContent='更新失敗，查詢已暫停。請確認網路及班表同步服務狀態，再按「更新班表」重試。';$('refresh').disabled=false;$('refresh').textContent='重新更新班表';};loadPublicRoster(window.ROSTER_API_URL).then(data=>{if(!data||!Array.isArray(data.people)||!data.people.length){fail();return;}roster=data;$('page-title').textContent='前臺代班查詢｜'+data.year+' 年 '+data.month+' 月';const last=$('date').value;$('date').replaceChildren();const end=new Date(Date.UTC(data.year,data.month,0)).getUTCDate();for(let n=1;n<=end;n++){const d=new Date(Date.UTC(data.year,data.month-1,n)),k=dayKey(d),o=document.createElement('option');o.value=k;o.textContent=data.month+' 月 '+n+' 日（'+'日一二三四五六'[d.getUTCDay()]+'）';$('date').append(o);}const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Taipei'}).format(new Date());if([...$('date').options].some(o=>o.value===last))$('date').value=last;else if([...$('date').options].some(o=>o.value===today))$('date').value=today;$('stamp').textContent='最後成功讀取：'+new Date(data.fetchedAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false});$('status').className=data.warnings.length?'warn':'';$('status').textContent='更新成功，已讀取雲端「'+data.sourceSheet+'」。'+data.warnings.join('；');$('filters').disabled=false;$('refresh').disabled=false;$('refresh').textContent='更新班表';render();}).catch(fail);}
$('refresh').addEventListener('click',refresh);for(const id of ['date','venue','slot','name'])$(id).addEventListener('input',render);refresh();
</script></body></html>
